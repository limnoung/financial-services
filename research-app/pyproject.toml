[project]
name = "gems-research"
version = "0.2.1"
description = "Evidence-based investment attractiveness scoring with DartLab"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
data = ["dartlab==0.12.0"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
gems-research = "gems_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gems_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
